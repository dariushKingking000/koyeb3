name: 📧 Persistent Email + Inbox
on: 
  workflow_dispatch:
  schedule: 
    - cron: '* * * * *'  # هر دقیقه

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: 📧 ایمیل
      id: email
      env:
        SID: ${{ secrets.GUERRILLA_SID }}
      run: |
        EMAIL=$(curl -s "https://api.guerrillamail.com/ajax.php?f=get_email_address&sid_token=$SID" | \
               grep -o '"email_addr":"[^"]*' | cut -d'"' -f4)
        echo "email=$EMAIL" >> $GITHUB_OUTPUT
        echo "✅ $EMAIL"

    - name: 📥 Inbox
      env:
        SID: ${{ secrets.GUERRILLA_SID }}
      run: |
        COUNT=$(curl -s "https://api.guerrillamail.com/ajax.php?f=check_email&sid_token=$SID" | \
                grep -o '"id":[0-9]*' | wc -l)
        echo "تعداد ایمیل: $COUNT"
        
        if [ "$COUNT" -gt 0 ]; then
          echo "✅ جدید!"
          MAIL_ID=$(curl -s "https://api.guerrillamail.com/ajax.php?f=check_email&sid_token=$SID" | \
                    grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          curl -s "https://api.guerrillamail.com/ajax.php?f=fetch_email&email_id=$MAIL_ID&sid_token=$SID"
        fi
