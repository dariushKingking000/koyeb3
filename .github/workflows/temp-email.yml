name: ✅ Fixed Email Checker
on:
  push:
  workflow_dispatch:

jobs:
  check-email:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 📦 jq نصب
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: 📧 ایمیل
      id: email
      env:
        USERNAME: ${{ secrets.TEMP_EMAIL_USERNAME }}
        DOMAIN: ${{ secrets.TEMP_EMAIL_DOMAIN }}
      run: |
        EMAIL="$USERNAME@$DOMAIN"
        echo "email=$EMAIL" >> $GITHUB_OUTPUT
        echo "ایمیل: $EMAIL"

    - name: 📥 چک inbox (ساده)
      id: inbox
      env:
        USERNAME: ${{ steps.email.outputs.username || secrets.TEMP_EMAIL_USERNAME }}
        DOMAIN: ${{ steps.email.outputs.domain || secrets.TEMP_EMAIL_DOMAIN }}
      run: |
        echo "چک $USERNAME@$DOMAIN"
        
        # curl ساده
        RESPONSE=$(curl -s "https://www.1secmail.com/api/v1/?action=getMessages&login=$USERNAME&domain=$DOMAIN")
        COUNT=$(echo "$RESPONSE" | jq 'length')
        
        echo "تعداد ایمیل: $COUNT"
        if [ "$COUNT" -gt 0 ]; then
          echo "✅ ایمیل هست!"
          echo "$RESPONSE"
        else
          echo "📭 خالی"
        fi
        echo "status=done" >> $GITHUB_OUTPUT

    - name: 🎉 نتیجه
      run: |
        echo "ایمیل: ${{ steps.email.outputs.email }}"
        echo "تمام ✅"
