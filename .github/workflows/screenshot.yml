name: Live Stream to Aparat - Always On
on: [push]
permissions:
  contents: write
jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Setup Python & FFmpeg & Xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg xvfb
        pip install playwright requests
        playwright install chromium
    
    - name: Run Continuous Stream with Command Watcher
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISPLAY: ":99"
      shell: bash
      run: |
        # راه‌اندازی Xvfb در پس‌زمینه
        Xvfb :99 -screen 0 1280x720x24 &
        sleep 2
        
        cat > streamer.py << 'EOF'
        import requests
        import time
        import datetime
        import os
        import base64
        import sys
        import subprocess as sp
        import threading
        from playwright.sync_api import sync_playwright
        
        def debug_print(msg):
            print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
            sys.stdout.flush()
        
        # ========== تنظیمات ==========
        TARGET_REPO_OWNER = "dariushKingking000"
        TARGET_REPO_NAME = "koyeb3"
        FILE_PATH = "c.txt"
        HISTORY_FILE = "executed_commands.txt"
        
        RTMP_URL = "rtmp://rtmp.cdn.asset.aparat.com:443/event"
        STREAM_KEY = "e83de8cf9afbf569b17e1addf487ed275?s=b01212e4d2d99292"
        FULL_RTMP = f"{RTMP_URL}/{STREAM_KEY}"
        # ============================
        
        headers = {
            'Authorization': f'token {os.getenv("GITHUB_TOKEN")}',
            'Accept': 'application/vnd.github.v3+json'
        }
        
        current_page = None
        ffmpeg_proc = None
        is_streaming = True
        
        def upload_history_to_repo():
            try:
                with open(HISTORY_FILE, 'rb') as f:
                    content = base64.b64encode(f.read()).decode('utf-8')
            except FileNotFoundError:
                return True
            
            url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{HISTORY_FILE}"
            response = requests.get(url, headers=headers)
            sha = response.json().get('sha') if response.status_code == 200 else None
            
            data = {
                "message": f"📝 Update history {datetime.datetime.now().strftime('%Y-%m-%d %H:%M')}",
                "content": content,
                "branch": "main"
            }
            if sha:
                data["sha"] = sha
            
            put_response = requests.put(url, headers=headers, json=data)
            return put_response.status_code in [200, 201]
        
        def load_executed_commands():
            try:
                with open(HISTORY_FILE, 'r') as f:
                    return set(line.strip() for line in f if line.strip())
            except FileNotFoundError:
                return set()
        
        def save_executed_command(command):
            with open(HISTORY_FILE, 'a') as f:
                f.write(command + '\n')
            debug_print(f"💾 ذخیره در تاریخچه: {command}")
        
        def get_c_txt_content():
            url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
            try:
                response = requests.get(url, headers=headers)
                if response.status_code == 200:
                    content = response.json().get('content', '')
                    if content:
                        decoded = base64.b64decode(content).decode('utf-8')
                        return decoded.strip()
                return None
            except Exception as e:
                debug_print(f"❌ خطا: {e}")
                return None
        
        def capture_and_stream():
            """گرفتن فریم از صفحه و ارسال به ffmpeg"""
            global current_page, ffmpeg_proc, is_streaming
            while is_streaming:
                try:
                    if current_page and ffmpeg_proc and ffmpeg_proc.stdin:
                        screenshot = current_page.screenshot(type='png')
                        ffmpeg_proc.stdin.write(screenshot)
                    time.sleep(0.1)
                except (BrokenPipeError, Exception) as e:
                    debug_print(f"⚠️ خطا در گرفتن فریم: {e}")
                    time.sleep(1)
        
        def execute_command(page, command):
            cmd_lower = command.lower().strip()
            
            if cmd_lower.startswith('click '):
                parts = cmd_lower.split()
                if len(parts) == 3:
                    try:
                        x, y = int(parts[1]), int(parts[2])
                        debug_print(f"🖱️ کلیک ({x}, {y})")
                        page.mouse.click(x, y)
                        return True
                    except ValueError:
                        debug_print(f"⚠️ مختصات نامعتبر")
                        return False
            
            elif cmd_lower.startswith('type '):
                parts = command.split(' ', 1)
                if len(parts) == 2:
                    debug_print(f"⌨️ تایپ: {parts[1]}")
                    page.keyboard.type(parts[1])
                    return True
                else:
                    debug_print(f"⚠️ دستور type نامعتبر")
                    return False
            
            else:
                debug_print(f"⚠️ دستور ناشناخته: {command}")
                return False
        
        def command_watcher():
            global current_page
            executed = load_executed_commands()
            
            while is_streaming:
                try:
                    content = get_c_txt_content()
                    
                    if content:
                        commands = [line.strip() for line in content.split('\n') if line.strip()]
                        new_commands = [cmd for cmd in commands if cmd not in executed]
                        
                        if new_commands and current_page:
                            debug_print(f"✨ {len(new_commands)} دستور جدید: {new_commands}")
                            
                            for command in new_commands:
                                if execute_command(current_page, command):
                                    save_executed_command(command)
                                    executed.add(command)
                                time.sleep(0.5)
                            
                            upload_history_to_repo()
                        else:
                            debug_print("🎥 استریم فعال - منتظر دستور...")
                    else:
                        debug_print("⚠️ c.txt پیدا نشد")
                    
                    time.sleep(30)
                    
                except Exception as e:
                    debug_print(f"💥 خطا در واتچر: {e}")
                    time.sleep(30)
        
        def main():
            global current_page, ffmpeg_proc, is_streaming
            
            debug_print("🚀 شروع استریم زنده به آپارات")
            debug_print(f"🎯 RTMP: {RTMP_URL}")
            debug_print("🌐 مرورگر در حال باز شدن...")
            
            with sync_playwright() as p:
                browser = p.chromium.launch(headless=False)
                current_page = browser.new_page()
                current_page.goto('https://www.google.com')
                debug_print("✅ صفحه گوگل باز شد")
                
                # راه‌اندازی ffmpeg
                ffmpeg_cmd = [
                    'ffmpeg', '-y',
                    '-f', 'rawvideo',
                    '-vcodec', 'rawvideo',
                    '-s', '1280x720',
                    '-pix_fmt', 'rgb24',
                    '-r', '10',
                    '-i', '-',
                    '-c:v', 'libx264',
                    '-preset', 'ultrafast',
                    '-b:v', '1200k',
                    '-g', '30',
                    '-f', 'flv',
                    FULL_RTMP
                ]
                
                ffmpeg_proc = sp.Popen(ffmpeg_cmd, stdin=sp.PIPE, stdout=sp.DEVNULL, stderr=sp.DEVNULL)
                debug_print("🎥 ffmpeg راه‌اندازی شد")
                
                # ترد گرفتن فریم
                capture_thread = threading.Thread(target=capture_and_stream, daemon=True)
                capture_thread.start()
                
                # ترد واتچر
                watcher_thread = threading.Thread(target=command_watcher, daemon=True)
                watcher_thread.start()
                
                try:
                    while True:
                        time.sleep(60)
                        debug_print("💓 استریم依然稳定...")
                except KeyboardInterrupt:
                    debug_print("🛑 در حال بستن...")
                finally:
                    is_streaming = False
                    if ffmpeg_proc:
                        ffmpeg_proc.stdin.close()
                        ffmpeg_proc.wait()
                    browser.close()
        
        if __name__ == "__main__":
            main()
        EOF
        
        # اجرا با xvfb-run
        xvfb-run --auto-servernum python3 streamer.py
