name: Remote Browser Controller (Undetectable)
on: 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Patchright & HumanTyping
        run: |
          # نصب Patchright (جایگزین Playwright برای دور زدن تشخیص)
          pip install patchright
          patchright install chromium
          
          # نصب HumanTyping برای تایپ شبیه انسان
          pip install git+https://github.com/Lax3n/HumanTyping.git
          
          # نصب کتابخانه‌های جانبی
          pip install requests

      - name: Run Remote Browser Server (Undetectable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > remote_browser.py << 'EOF'
          import requests
          import time
          import datetime
          import os
          import base64
          import sys
          import uuid
          import random
          from patchright.sync_api import sync_playwright  # 🔑 کلید اصلی
          from humantyping import HumanTyper  # برای تایپ شبیه انسان

          def debug_print(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
              sys.stdout.flush()

          TARGET_REPO_OWNER = "dariushKingking000"
          TARGET_REPO_NAME = "koyeb3"
          FILE_PATH = "c.txt"
          FRAME_FOLDER = "frames"
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')

          headers = {
              'Authorization': f'token {GITHUB_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }

          def upload_frame(frame_data, description=""):
              """آپلود فریم با نام یکتا"""
              unique_id = f"{datetime.datetime.now().strftime('%Y%m%d_%H%M%S')}_{uuid.uuid4().hex[:8]}"
              file_path = f"{FRAME_FOLDER}/frame_{unique_id}.png"
              content = base64.b64encode(frame_data).decode('utf-8')
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{file_path}"
              data = {"message": f"📸 {description}", "content": content, "branch": "main"}
              put_response = requests.put(url, headers=headers, json=data)
              if put_response.status_code in [200, 201]:
                  debug_print(f"✅ فریم آپلود شد {description}")
                  return True
              return False

          def get_c_txt_content():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              try:
                  response = requests.get(url, headers=headers)
                  if response.status_code == 200:
                      content = response.json().get('content', '')
                      if content:
                          decoded = base64.b64decode(content).decode('utf-8')
                          return decoded.strip()
                  return None
              except Exception as e:
                  debug_print(f"❌ خطا: {e}")
                  return None

          def clear_c_txt():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              response = requests.get(url, headers=headers)
              sha = response.json().get('sha') if response.status_code == 200 else None
              content_b64 = base64.b64encode(b"# waiting for next command").decode('utf-8')
              data = {"message": "🧹 Clear", "content": content_b64, "branch": "main"}
              if sha:
                  data["sha"] = sha
              requests.put(url, headers=headers, json=data)
              debug_print("🗑️ c.txt پاک شد")

          def execute_command(page, command):
              """اجرای دستور - با Patchright و HumanTyping"""
              cmd_lower = command.lower().strip()

              # دستور کلیک
              if cmd_lower.startswith('click '):
                  parts = cmd_lower.split()
                  if len(parts) == 3:
                      try:
                          x, y = int(parts[1]), int(parts[2])
                          debug_print(f"🖱️ کلیک در ({x}, {y})")
                          # حرکت موس شبیه انسان
                          page.mouse.move(x, y, steps=random.randint(5, 15))
                          time.sleep(random.uniform(0.1, 0.3))
                          page.mouse.click(x, y)
                          return True
                      except ValueError:
                          debug_print(f"⚠️ مختصات نامعتبر")
                          return False
                  else:
                      debug_print(f"⚠️ فرمت click نامعتبر")
                      return False

              # دستور Enter
              elif cmd_lower == "enter":
                  debug_print(f"⏎ Enter زده شد")
                  page.keyboard.press("Enter", delay=random.randint(50, 150))
                  return True

              # هر چیز دیگر → تایپ شبیه انسان با HumanTyping
              else:
                  debug_print(f"⌨️ تایپ شبیه انسان: {command}")
                  try:
                      # پیدا کردن باکس active یا باکس جستجوی گوگل
                      try:
                          input_box = page.locator("input[type='text'], textarea, [name='q']").first
                          await input_box.click()
                      except:
                          # اگر باکسی نبود، از صفحه کلید استفاده کن
                          pass
                      
                      # تایپ با HumanTyping (سرعت 60 کلمه در دقیقه + خطاهای طبیعی)
                      typer = HumanTyper(wpm=60)
                      # توجه: HumanTyping از async استفاده می‌کند، برای sync باید اینطور بنویسیم
                      for char in command:
                          page.keyboard.type(char, delay=random.randint(50, 200))
                          time.sleep(random.uniform(0.05, 0.15))
                      
                      return True
                  except Exception as e:
                      debug_print(f"⚠️ خطا در تایپ: {e}")
                      # fallback به تایپ معمولی
                      page.keyboard.type(command, delay=random.randint(50, 150))
                      return True

          def clean_old_frames(max_frames=30):
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FRAME_FOLDER}"
              response = requests.get(url, headers=headers)
              if response.status_code == 200:
                  files = response.json()
                  if files and isinstance(files, list):
                      png_files = sorted([f for f in files if f['name'].endswith('.png')], key=lambda x: x['name'])
                      if len(png_files) > max_frames:
                          for old_file in png_files[:-max_frames]:
                              delete_url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FRAME_FOLDER}/{old_file['name']}"
                              delete_data = {"message": f"🗑️ حذف", "sha": old_file['sha'], "branch": "main"}
                              requests.delete(delete_url, headers=headers, json=delete_data)

          def main():
              debug_print("🚀 شروع به کار کرد (با Patchright - ضد تشخیص)")
              debug_print("📋 فقط وقتی دستور بدی فریم میگیرم")

              last_command = None

              with sync_playwright() as p:
                  # 🔑 تنظیمات مهم برای دور زدن تشخیص
                  browser = p.chromium.launch(
                      headless=False,  # حالت headed (مهم برای دور زدن)
                      args=[
                          '--disable-blink-features=AutomationControlled',  # مخفی کردن اتومیشن
                          '--no-sandbox',
                          '--disable-dev-shm-usage',
                      ]
                  )
                  
                  # ایجاد کانتکست با تنظیمات شبیه انسان
                  context = browser.new_context(
                      viewport={'width': 1920, 'height': 1080},
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
                      locale='en-US',
                      timezone_id='America/New_York',
                      permissions=['geolocation'],
                      device_scale_factor=1,
                  )
                  
                  page = context.new_page()
                  
                  # تنظیمات اضافی برای شبیه‌سازی انسان
                  page.set_default_timeout(30000)
                  
                  # رفتن به گوگل با تاخیر طبیعی
                  debug_print("🌐 در حال رفتن به گوگل...")
                  page.goto('https://www.google.com', wait_until='networkidle')
                  
                  # تاخیر طبیعی برای لود صفحه
                  time.sleep(random.uniform(2, 4))
                  
                  debug_print("✅ گوگل باز شد")

                  # فریم اولیه
                  screenshot = page.screenshot(type='png')
                  upload_frame(screenshot, "initial")

                  while True:
                      try:
                          content = get_c_txt_content()

                          if content and content != last_command and not content.startswith('#'):
                              debug_print(f"📖 دستور: {content}")

                              if execute_command(page, content):
                                  last_command = content
                                  
                                  # تاخیر طبیعی بعد از اجرا
                                  time.sleep(random.uniform(1, 2))
                                  
                                  # بعد از اجرای دستور، فریم بگیر
                                  screenshot = page.screenshot(type='png')
                                  upload_frame(screenshot, f"after: {content[:30]}")
                                  
                                  clear_c_txt()
                              else:
                                  clear_c_txt()

                          # هر 1 ثانیه یکبار چک کن (بدون فریم اضافی)
                          time.sleep(1)

                      except Exception as e:
                          debug_print(f"💥 خطا: {e}")
                          time.sleep(5)

          if __name__ == "__main__":
              main()
          EOF

          python3 remote_browser.py
