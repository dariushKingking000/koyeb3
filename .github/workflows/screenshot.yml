name: Remote Browser Controller
on: 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Patchright
        run: |
          pip install patchright
          patchright install chromium
          pip install requests

      - name: Run Remote Browser Server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > remote_browser.py << 'EOF'
          import requests
          import time
          import datetime
          import os
          import base64
          import sys
          import uuid
          import random
          import subprocess
          from patchright.sync_api import sync_playwright

          def debug_print(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
              sys.stdout.flush()

          TARGET_REPO_OWNER = "dariushKingking000"
          TARGET_REPO_NAME = "koyeb3"
          FILE_PATH = "c.txt"
          FRAME_FOLDER = "frames"
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')

          headers = {
              'Authorization': f'token {GITHUB_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }

          def upload_frame(frame_data, description=""):
              unique_id = f"{datetime.datetime.now().strftime('%Y%m%d_%H%M%S')}_{uuid.uuid4().hex[:8]}"
              file_path = f"{FRAME_FOLDER}/frame_{unique_id}.png"
              content = base64.b64encode(frame_data).decode('utf-8')
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{file_path}"
              data = {"message": f"📸 {description}", "content": content, "branch": "main"}
              put_response = requests.put(url, headers=headers, json=data)
              if put_response.status_code in [200, 201]:
                  debug_print(f"✅ فریم آپلود شد")
                  return True
              return False

          def get_c_txt_content():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              try:
                  response = requests.get(url, headers=headers)
                  if response.status_code == 200:
                      content = response.json().get('content', '')
                      if content:
                          decoded = base64.b64decode(content).decode('utf-8')
                          return decoded.strip()
                  return None
              except Exception as e:
                  debug_print(f"❌ خطا: {e}")
                  return None

          def clear_c_txt():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              response = requests.get(url, headers=headers)
              sha = response.json().get('sha') if response.status_code == 200 else None
              content_b64 = base64.b64encode(b"# waiting").decode('utf-8')
              data = {"message": "🧹 Clear", "content": content_b64, "branch": "main"}
              if sha:
                  data["sha"] = sha
              requests.put(url, headers=headers, json=data)
              debug_print("🗑️ پاک شد")

          def execute_command(page, command):
              cmd_lower = command.lower().strip()

              if cmd_lower.startswith('click '):
                  parts = cmd_lower.split()
                  if len(parts) == 3:
                      try:
                          x, y = int(parts[1]), int(parts[2])
                          debug_print(f"🖱️ کلیک ({x}, {y})")
                          page.mouse.click(x, y)
                          return True
                      except ValueError:
                          debug_print(f"⚠️ مختصات نامعتبر")
                          return False
                  else:
                      debug_print(f"⚠️ فرمت click نامعتبر")
                      return False

              elif cmd_lower == "enter":
                  debug_print(f"⏎ Enter")
                  page.keyboard.press("Enter")
                  return True

              elif cmd_lower == "#refresh" or cmd_lower == "refresh":
                  debug_print(f"🔄 فریم تازه")
                  return True

              else:
                  debug_print(f"⌨️ تایپ: {command}")
                  for ch in command:
                      page.keyboard.type(ch, delay=random.randint(30, 100))
                      time.sleep(random.uniform(0.02, 0.08))
                  return True

          def main():
              debug_print("🚀 شروع")
              debug_print("📋 منتظر دستورات...")

              last_command = None

              # تست DNS با استفاده از curl
              debug_print("🔍 تست اتصال با curl...")
              try:
                  subprocess.run(["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "https://google.com"], timeout=10)
                  debug_print("✅ curl به google.com متصل شد")
              except:
                  debug_print("⚠️ curl نتونست وصل شود")

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          '--no-sandbox',
                          '--disable-dev-shm-usage',
                          '--disable-setuid-sandbox',
                          '--disable-gpu',
                          '--disable-software-rasterizer',
                          '--dns-prefetch-disable',
                          '--disable-features=VizDisplayCompositor',
                          '--disable-features=OptimizationHints',
                          '--disable-features=OptimizationHintsFetching',
                          '--disable-features=OptimizationGuideModelDownloading',
                          '--disable-features=PrivacySandboxSettings4',
                          '--disable-features=PrivacySandboxAdsAPI',
                          '--disable-ipc-flooding-protection',
                      ]
                  )
                  
                  context = browser.new_context(
                      viewport={'width': 1280, 'height': 720},
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
                      ignore_https_errors=True,
                      extra_http_headers={
                          'Accept-Language': 'en-US,en;q=0.9',
                      }
                  )
                  
                  page = context.new_page()
                  
                  page.add_init_script("""
                      Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
                      delete window.cdc_adoQpoasnfa76pfcZLmcfl_Array;
                      delete window.cdc_adoQpoasnfa76pfcZLmcfl_Promise;
                      delete window.cdc_adoQpoasnfa76pfcZLmcfl_Symbol;
                  """)
                  
                  page.set_default_timeout(90000)
                  
                  # گوگل با IP و Host header
                  debug_print("🌐 تلاش ویژه برای گوگل...")
                  
                  try:
                      # روش اول: استفاده از fetch از طریق requests
                      debug_print("🔄 روش 1: تست با requests library")
                      test_req = requests.get('https://google.com', timeout=10)
                      debug_print(f"✅ requests به google.com متصل شد: {test_req.status_code}")
                  except Exception as e:
                      debug_print(f"⚠️ requests هم وصل نشد: {e}")
                  
                  # روش دوم: با IP و Host header
                  debug_print("🔄 روش 2: استفاده از IP + Host header")
                  
                  # ایجاد یک درخواست با IP مستقیم
                  try:
                      page.goto('https://142.250.185.46', wait_until='domcontentloaded', timeout=45000)
                      debug_print("✅ با IP مستقیم باز شد")
                  except Exception as e:
                      debug_print(f"❌ IP مستقیم جواب نداد: {str(e)[:100]}")
                      
                      # روش سوم: استفاده از about:blank و سپس navigation
                      debug_print("🔄 روش 3: about:blank -> navigation")
                      page.goto('about:blank')
                      time.sleep(1)
                      
                      try:
                          await page.evaluate("""
                              window.location.href = 'https://google.com';
                          """)
                      except:
                          page.goto('https://google.com', timeout=60000)
                  
                  time.sleep(3)
                  
                  try:
                      current_url = page.url
                      debug_print(f"📍 URL فعلی: {current_url}")
                  except:
                      debug_print("❌ نمی‌توان URL را گرفت")
                  
                  screenshot = page.screenshot(type='png')
                  upload_frame(screenshot, "initial")

                  while True:
                      try:
                          content = get_c_txt_content()

                          if content and content != last_command and not content.startswith('#'):
                              debug_print(f"📖 دستور: {content}")

                              if execute_command(page, content):
                                  last_command = content
                                  time.sleep(0.5)
                                  screenshot = page.screenshot(type='png')
                                  upload_frame(screenshot, "after")
                                  clear_c_txt()
                              else:
                                  clear_c_txt()

                          time.sleep(1)

                      except Exception as e:
                          debug_print(f"💥 خطا: {e}")
                          time.sleep(5)

          if __name__ == "__main__":
              main()
          EOF

          python3 remote_browser.py
