name: c.txt Smart Monitor
on:
  workflow_dispatch:
  repository_dispatch:
    types: [flask-alive]

permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
    - name: 🔍 Clone Target Repo
      run: |
        git clone https://github.com/dariushKingking000/koyeb3.git target-repo
        cd target-repo
        echo "📂 Target repo cloned: $(ls -la)"
    
    - name: 🔍 Check c.txt در koyeb3 (حداکثر ۳۰ دور)
      id: smart_check
      run: |
        echo "🔎 منتظر c.txt در https://github.com/dariushKingking000/koyeb3 (حداکثر ۳۰ دقیقه)..."
        cd target-repo
        for i in {1..30}; do
          if [ -f "c.txt" ]; then
            echo "✅ دور $i - c.txt پیدا شد! $(cat c.txt)"
            echo "found=true" >> $GITHUB_OUTPUT
            echo "round=$i" >> $GITHUB_OUTPUT
            echo "content=$(cat c.txt)" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "⏳ دور $i/30 - c.txt نیست، pull کنیم..."
          git pull origin main --quiet || true
          echo "📂 Current files: $(ls -la)"
          sleep 60
        done
        echo "❌ ۳۰ دور تمام - c.txt در koyeb3 پیدا نشد"
        echo "found=false" >> $GITHUB_OUTPUT
    
    - name: 📋 Show Final Status & Logs
      run: |
        echo "🎯 Target: https://github.com/dariushKingking000/koyeb3"
        echo "✅ Result: found=${{ steps.smart_check.outputs.found }}"
        echo "🔢 Round: ${{ steps.smart_check.outputs.round || 'N/A' }}"
        echo "📄 Content: ${{ steps.smart_check.outputs.content || 'N/A' }}"
        echo "📂 Final files:"
        ls -la target-repo/ || true
        echo "🕒 تمام لاگ‌های ۳۰ دور در Actions tab قابل مشاهده"
    
    - name: 💾 Create Status File (اختیاری)
      if: always()
      run: |
        cat > status.txt << EOF
        Timestamp: $(date)
        Target: https://github.com/dariushKingking000/koyeb3
        Found: ${{ steps.smart_check.outputs.found }}
        Round: ${{ steps.smart_check.outputs.round || 'N/A' }}
        Content: ${{ steps.smart_check.outputs.content || 'N/A' }}
        EOF
        echo "::notice:: Status file created with results"
