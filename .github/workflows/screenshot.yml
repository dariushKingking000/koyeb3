name: 1-Time c.txt Check
on:
  workflow_dispatch:
  repository_dispatch:
    types: [flask-alive]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🔍 1 بار چک c.txt
      id: check
      run: |
        if [ -f "c.txt" ]; then
          echo "✅ c.txt پیدا شد! $(cat c.txt)"
          echo "found=true" >> $GITHUB_OUTPUT
        else
          echo "❌ c.txt نیست"
          echo "found=false" >> $GITHUB_OUTPUT
        fi
    
    - name: 📱 Screenshot (فقط 1 بار)
      if: steps.check.outputs.found == 'true'
      run: |
        pip install playwright pillow
        playwright install chromium
        python -c "from playwright.sync_api import sync_playwright; import datetime; now=datetime.datetime.now().strftime('%Y%m%d_%H%M'); with sync_playwright() as p: b=p.chromium.launch(headless=True); page=b.new_page(); page.goto('https://www.google.com'); page.screenshot(path=f'google_{now}.png'); b.close()"
    
    - name: 💾 Commit
      run: |
        git config user.name "1-Time Check"
        git config user.email "action@github.com"
        if [ "${{ steps.check.outputs.found }}" = "true" ]; then
          git add google_*.png c.txt
          git commit -m "✅ c.txt پیدا شد + Screenshot"
        else
          git commit --allow-empty -m "❌ c.txt نیست"
        fi
        git push origin main --force
