name: Google Screenshot to Repo
on: [push]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Playwright & Requests
      run: |
        pip install playwright pillow requests
        playwright install chromium
    
    - name: Check c.txt & Google Screenshot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_URL: https://api.github.com/repos/dariushKingking000/koyeb3/contents/c.txt
      run: |
        python -c "
        import requests
        import time
        from playwright.sync_api import sync_playwright
        import datetime
        import os
        
        print('🔍 شروع چک کردن c.txt در repo: https://github.com/dariushKingking000/koyeb3')
        
        def check_c_txt():
            headers = {'Authorization': f'token {os.getenv('GITHUB_TOKEN')}'}
            try:
                response = requests.get(os.getenv('REPO_URL'), headers=headers)
                print(f'[{datetime.datetime.now()}] ✅ درخواست API ارسال شد - Status: {response.status_code}')
                if response.status_code == 200:
                    print(f'[{datetime.datetime.now()}] 🎉 فایل c.txt پیدا شد! Screenshot میگیریم...')
                    return True
                else:
                    print(f'[{datetime.datetime.now()}] ❌ فایل c.txt پیدا نشد')
                    return False
            except Exception as e:
                print(f'[{datetime.datetime.now()}] ❌ خطا در چک کردن: {str(e)}')
                return False
        
        found = False
        for i in range(30):
            print(f'[{datetime.datetime.now()}] 🔄 چک {i+1}/30 - انتظار 60 ثانیه...')
            if check_c_txt():
                found = True
                break
            time.sleep(60)
        
        if found:
            print('📸 گرفتن screenshot از Google...')
            now = datetime.datetime.now().strftime('%Y%m%d_%H%M')
            with sync_playwright() as p:
                browser = p.chromium.launch(headless=True)
                page = browser.new_page()
                page.goto('https://www.google.com')
                page.screenshot(path=f'google_{now}.png', full_page=True)
                browser.close()
            print(f'✅ Screenshot ذخیره شد: google_{now}.png')
        else:
            print('❌ بعد از 30 بار چک، c.txt پیدا نشد')
        "
    
    - name: Commit & Push
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add google_*.png || echo "هیچ screenshot جدیدی نیست"
        git commit -m "🌐 Google screenshot $(date +%Y-%m-%d_%H-%M)" || exit 0
        git push
