name: Google Screenshot to Repo
on: [push]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Playwright & Requests
      run: |
        pip install playwright pillow requests
        playwright install chromium
    
    - name: Check c.txt & Google Screenshot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_URL: https://api.github.com/repos/dariushKingking000/koyeb3/contents/c.txt
      run: |
        python -c "
        import requests
        import time
        from playwright.sync_api import sync_playwright
        import datetime
        import os
        
        print('🚀 شروع کار - میرم چک کنم repo: https://github.com/dariushKingking000/koyeb3')
        
        def check_c_txt():
            print('🌐 وارد repo شدم: https://github.com/dariushKingking000/koyeb3')
            headers = {'Authorization': 'token ' + os.getenv('GITHUB_TOKEN')}
            try:
                print('🔍 دارم دنبال c.txt میگردم...')
                response = requests.get(os.getenv('REPO_URL'), headers=headers)
                print('📡 جواب API اومد - Status: %s' % response.status_code)
                now_time = datetime.datetime.now().strftime('%H:%M:%S')
                if response.status_code == 200:
                    print('🎉🎉 در دقیقه %s فایل c.txt پیدا شد!!!' % now_time)
                    return True
                else:
                    print('❌ در دقیقه %s فایل c.txt پیدا نشد' % now_time)
                    return False
            except Exception as e:
                print('💥 خطا در دقیقه %s: %s' % (datetime.datetime.now().strftime('%H:%M:%S'), str(e)))
                return False
        
        print('⏰ شروع 30 بار چک هر دقیقه...')
        found = False
        for i in range(30):
            minute_check = i + 1
            print('🔄 چک شماره %d از 30 - زمان: %s' % (minute_check, datetime.datetime.now().strftime('%H:%M:%S')))
            if check_c_txt():
                found = True
                break
            print('⏳ صبر 60 ثانیه برای چک بعدی...')
            time.sleep(60)
        
        if found:
            print('📸🎥 الان screenshot Google میگیرم...')
            now = datetime.datetime.now().strftime('%Y%m%d_%H%M')
            with sync_playwright() as p:
                browser = p.chromium.launch(headless=True)
                page = browser.new_page()
                page.goto('https://www.google.com')
                page.screenshot(path='google_%s.png' % now, full_page=True)
                browser.close()
            print('✅✅ screenshot ذخیره شد: google_%s.png' % now)
        else:
            print('😞 بعد 30 دقیقه چک کردن، c.txt پیدا نشد')
        "
    
    - name: Commit & Push
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add google_*.png || echo "هیچ screenshot جدیدی نیست"
        git commit -m "🌐 Google screenshot $(date +%Y-%m-%d_%H-%M)" || exit 0
        git push
