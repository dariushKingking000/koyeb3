name: Google Screenshot to Repo
on: [push]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Playwright
      run: |
        pip install playwright pillow requests
        playwright install chromium
    
    - name: Check c.txt & Google screenshot
      run: |
        python -c "
        import requests
        import time
        from playwright.sync_api import sync_playwright
        import datetime
        
        url = 'https://github.com/dariushKingking000/koyeb3/raw/main/c.txt'
        checks = 0
        max_checks = 30
        
        while checks < max_checks:
            try:
                response = requests.get(url, timeout=10)
                if response.status_code == 200:
                    content = response.text.strip()
                    now = datetime.datetime.now().strftime('%Y%m%d_%H%M')
                    print(f'✅ c.txt found! Content: {content}')
                    
                    with sync_playwright() as p:
                        browser = p.chromium.launch(headless=True)
                        page = browser.new_page()
                        page.goto('https://www.google.com')
                        page.screenshot(path=f'google_{now}.png', full_page=True)
                        browser.close()
                    break
                else:
                    print(f'❌ c.txt not found (check {checks+1}/{max_checks})')
            except:
                print(f'❌ Error checking (check {checks+1}/{max_checks})')
            
            checks += 1
            if checks < max_checks:
                time.sleep(60)
        
        if checks >= max_checks:
            print('⏰ Max checks reached, no c.txt found')
        "
    
    - name: Commit & Push
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add google_*.png
        git commit -m "🌐 Google screenshot $(date +%Y-%m-%d_%H-%M)" || exit 0
        git push
