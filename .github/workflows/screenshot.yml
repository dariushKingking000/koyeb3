name: Remote Browser Controller
on: 
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Clear old frames
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests
          import base64
          import os
          
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')
          REPO_OWNER = "dariushKingking000"
          REPO_NAME = "koyeb3"
          FRAME_FOLDER = "frames"
          
          headers = {
              'Authorization': f'token {GITHUB_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }
          
          # دریافت لیست فایل‌ها
          url = f"https://api.github.com/repos/{REPO_OWNER}/{REPO_NAME}/contents/{FRAME_FOLDER}"
          response = requests.get(url, headers=headers)
          
          if response.status_code == 200:
              files = response.json()
              if files and isinstance(files, list):
                  png_files = [f for f in files if f['name'].endswith('.png')]
                  print(f"🗑️ حذف {len(png_files)} فریم قدیمی...")
                  for old_file in png_files:
                      delete_url = f"https://api.github.com/repos/{REPO_OWNER}/{REPO_NAME}/contents/{FRAME_FOLDER}/{old_file['name']}"
                      delete_data = {
                          "message": f"🗑️ Clear old frame {old_file['name']}",
                          "sha": old_file['sha'],
                          "branch": "main"
                      }
                      requests.delete(delete_url, headers=headers, json=delete_data)
                  print("✅ فریم‌های قدیمی حذف شدند")
          else:
              # پوشه وجود ندارد، ایجاد کن
              dummy_content = base64.b64encode(b"frames folder").decode('utf-8')
              dummy_data = {
                  "message": "Create frames folder",
                  "content": dummy_content,
                  "branch": "main"
              }
              requests.put(url, headers=headers, json=dummy_data)
              print("📁 پوشه frames ایجاد شد")
          EOF

      - name: Run Remote Browser Server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > remote_browser.py << 'EOF'
          import requests
          import time
          import datetime
          import os
          import base64
          import sys
          from playwright.sync_api import sync_playwright

          def debug_print(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
              sys.stdout.flush()

          # تنظیمات
          TARGET_REPO_OWNER = "dariushKingking000"
          TARGET_REPO_NAME = "koyeb3"
          FILE_PATH = "c.txt"
          FRAME_FOLDER = "frames"
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')

          headers = {
              'Authorization': f'token {GITHUB_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }

          class FrameUploader:
              def __init__(self):
                  self.frame_counter = 0
              
              def upload_frame(self, frame_data):
                  """آپلود فریم با شمارنده ساده"""
                  self.frame_counter += 1
                  
                  file_path = f"{FRAME_FOLDER}/frame_{self.frame_counter:06d}.png"
                  
                  content = base64.b64encode(frame_data).decode('utf-8')
                  url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{file_path}"
                  
                  data = {
                      "message": f"📸 Frame {self.frame_counter}",
                      "content": content,
                      "branch": "main"
                  }
                  
                  put_response = requests.put(url, headers=headers, json=data)
                  if put_response.status_code in [200, 201]:
                      debug_print(f"✅ فریم {self.frame_counter} آپلود شد")
                      return True
                  else:
                      debug_print(f"❌ خطا در آپلود فریم {self.frame_counter}: {put_response.status_code}")
                      return False

          def get_c_txt_content():
              """خواندن دستورات از c.txt"""
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              try:
                  response = requests.get(url, headers=headers)
                  if response.status_code == 200:
                      content = response.json().get('content', '')
                      if content:
                          decoded = base64.b64decode(content).decode('utf-8')
                          return decoded.strip()
                  return None
              except Exception as e:
                  debug_print(f"❌ خطا در دریافت c.txt: {e}")
                  return None

          def clear_c_txt():
              """پاک کردن محتوای c.txt بعد از خواندن"""
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              
              content_b64 = base64.b64encode(b"# waiting for next command").decode('utf-8')
              
              response = requests.get(url, headers=headers)
              sha = None
              if response.status_code == 200:
                  sha = response.json().get('sha')
              
              data = {
                  "message": "🧹 Clear commands",
                  "content": content_b64,
                  "branch": "main"
              }
              if sha:
                  data["sha"] = sha
              
              put_response = requests.put(url, headers=headers, json=data)
              if put_response.status_code in [200, 201]:
                  debug_print("🗑️ c.txt پاک شد")

          def execute_command(page, command):
              """اجرای یک دستور روی صفحه"""
              cmd_lower = command.lower().strip()

              if cmd_lower.startswith('click '):
                  parts = cmd_lower.split()
                  if len(parts) == 3:
                      try:
                          x, y = int(parts[1]), int(parts[2])
                          debug_print(f"🖱️ کلیک در ({x}, {y})")
                          page.mouse.click(x, y)
                          return True
                      except ValueError:
                          debug_print(f"⚠️ مختصات نامعتبر: {command}")
                          return False
                  else:
                      debug_print(f"⚠️ فرمت click نامعتبر: {command}")
                      return False

              elif cmd_lower.startswith('type '):
                  parts = command.split(' ', 1)
                  if len(parts) == 2:
                      debug_print(f"⌨️ تایپ: {parts[1]}")
                      page.keyboard.type(parts[1])
                      return True
                  else:
                      debug_print(f"⚠️ دستور type بدون متن: {command}")
                      return False

              elif cmd_lower.startswith('#'):
                  debug_print(f"ℹ️ نظر: {command}")
                  return True

              elif cmd_lower == "enter":
                  debug_print(f"⏎ کلید Enter زده شد")
                  page.keyboard.press("Enter")
                  return True

              else:
                  debug_print(f"⚠️ دستور ناشناخته: {command}")
                  return False

          def main():
              debug_print("🚀 Remote Browser Server شروع به کار کرد")
              debug_print(f"🎯 ریپو: {TARGET_REPO_OWNER}/{TARGET_REPO_NAME}")
              debug_print("📋 منتظر دستورات از c.txt...")

              uploader = FrameUploader()
              last_command = None

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()
                  page.goto('https://www.google.com')
                  debug_print("✅ صفحه گوگل باز شد")

                  # فریم اولیه
                  screenshot = page.screenshot(type='png')
                  uploader.upload_frame(screenshot)

                  while True:
                      try:
                          # خواندن دستور از c.txt
                          content = get_c_txt_content()

                          if content and content != last_command and not content.startswith('#'):
                              debug_print(f"📖 دستور جدید: {content}")

                              if execute_command(page, content):
                                  last_command = content
                                  time.sleep(1)
                                  screenshot = page.screenshot(type='png')
                                  uploader.upload_frame(screenshot)
                                  clear_c_txt()
                              else:
                                  debug_print(f"⚠️ خطا در اجرای دستور: {content}")
                                  clear_c_txt()

                          # هر 3 ثانیه یک فریم معمولی
                          time.sleep(3)
                          screenshot = page.screenshot(type='png')
                          uploader.upload_frame(screenshot)

                      except Exception as e:
                          debug_print(f"💥 خطا: {e}")
                          time.sleep(5)

          if __name__ == "__main__":
              main()
          EOF

          python3 remote_browser.py
