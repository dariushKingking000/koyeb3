name: Remote Browser Controller
on: 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          pip install requests

      - name: Run Remote Browser Server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > remote_browser.py << 'EOF'
          import requests
          import time
          import datetime
          import os
          import base64
          import sys
          import uuid
          import random
          from playwright.sync_api import sync_playwright

          # Fix Windows encoding
          if sys.platform == 'win32':
              sys.stdout.reconfigure(encoding='utf-8', errors='replace')

          def debug_print(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
              sys.stdout.flush()

          TARGET_REPO_OWNER = "dariushKingking000"
          TARGET_REPO_NAME = "koyeb3"
          FILE_PATH = "c.txt"
          FRAME_FOLDER = "frames"
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')

          headers = {
              'Authorization': f'token {GITHUB_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }

          def upload_frame(frame_data, description=""):
              unique_id = f"{datetime.datetime.now().strftime('%Y%m%d_%H%M%S')}_{uuid.uuid4().hex[:8]}"
              file_path = f"{FRAME_FOLDER}/frame_{unique_id}.png"
              content = base64.b64encode(frame_data).decode('utf-8')
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{file_path}"
              data = {"message": f"{description}", "content": content, "branch": "main"}
              put_response = requests.put(url, headers=headers, json=data)
              if put_response.status_code in [200, 201]:
                  debug_print(f"Frame uploaded: {description}")
                  return True
              return False

          def get_c_txt_content():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              try:
                  response = requests.get(url, headers=headers)
                  if response.status_code == 200:
                      content = response.json().get('content', '')
                      if content:
                          decoded = base64.b64decode(content).decode('utf-8')
                          return decoded.strip()
                  return None
              except Exception as e:
                  debug_print(f"Error reading c.txt: {e}")
                  return None

          def clear_c_txt():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              response = requests.get(url, headers=headers)
              sha = response.json().get('sha') if response.status_code == 200 else None
              content_b64 = base64.b64encode(b"# waiting").decode('utf-8')
              data = {"message": "Clear", "content": content_b64, "branch": "main"}
              if sha:
                  data["sha"] = sha
              requests.put(url, headers=headers, json=data)
              debug_print("c.txt cleared")

          def execute_command(page, command):
              cmd_lower = command.lower().strip()
              debug_print(f"EXECUTING: {command}")
              
              # دستور کلیک
              if cmd_lower.startswith('click '):
                  parts = cmd_lower.split()
                  if len(parts) == 3:
                      try:
                          x, y = int(parts[1]), int(parts[2])
                          debug_print(f"Click at ({x}, {y})")
                          page.mouse.click(x, y)
                          return True
                      except ValueError:
                          debug_print(f"Invalid coordinates")
                          return False
                  else:
                      debug_print(f"Invalid click format")
                      return False

              # دستور Enter
              elif cmd_lower == "enter":
                  debug_print("Enter pressed")
                  page.keyboard.press("Enter")
                  return True

              # هر چیز دیگر = تایپ کردن
              else:
                  debug_print(f"Typing text: [{command}]")
                  # روش 1: پیدا کردن باکس فعال و پر کردن
                  try:
                      # سعی کن باکس ورودی فعال رو پیدا کنی
                      page.wait_for_selector('input, textarea, [contenteditable="true"]', timeout=3000)
                      focused = page.locator(':focus')
                      if focused.count() > 0:
                          focused.fill(command)
                          debug_print(f"Filled focused input: {command}")
                      else:
                          # اگر باکسی فوکوس نیست، از صفحه کلید استفاده کن
                          page.keyboard.type(command, delay=random.randint(50, 100))
                          debug_print(f"Typed with keyboard: {command}")
                  except:
                      # روش دوم: تایپ مستقیم با کیبورد
                      page.keyboard.type(command, delay=random.randint(50, 100))
                      debug_print(f"Typed with keyboard (fallback): {command}")
                  
                  time.sleep(0.5)
                  return True

          def main():
              debug_print("Starting...")
              debug_print("Waiting for commands from c.txt...")

              last_command = None

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(
                      viewport={'width': 1280, 'height': 720},
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
                  )
                  page = context.new_page()
                  
                  test_url = "https://httpbin.org/forms/post"
                  debug_print(f"Going to: {test_url}")
                  page.goto(test_url, timeout=60000)
                  debug_print(f"Opened: {page.url}")
                  
                  # کلیک روی باکس اسم برای فوکوس
                  try:
                      page.click('input[name="custname"]')
                      debug_print("Clicked on customer name field")
                  except:
                      debug_print("Could not click on field, but continuing...")

                  screenshot = page.screenshot(type='png')
                  upload_frame(screenshot, "initial")

                  while True:
                      try:
                          content = get_c_txt_content()
                          
                          if content and content != last_command and not content.startswith('#'):
                              debug_print(f"NEW COMMAND: {content}")
                              
                              if execute_command(page, content):
                                  last_command = content
                                  time.sleep(0.8)
                                  screenshot = page.screenshot(type='png')
                                  upload_frame(screenshot, f"after")
                                  clear_c_txt()
                                  debug_print(f"Command done: {content}")
                              else:
                                  debug_print(f"Command failed: {content}")
                                  clear_c_txt()
                          else:
                              time.sleep(10)
                              debug_print("Alive, waiting...")
                              
                      except Exception as e:
                          debug_print(f"Error: {e}")
                          time.sleep(5)

          if __name__ == "__main__":
              main()
          EOF

          python remote_browser.py
