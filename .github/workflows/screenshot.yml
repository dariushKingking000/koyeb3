name: Remote Browser Controller
on: 
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Clear old frames
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests, base64, os
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')
          REPO_OWNER, REPO_NAME, FRAME_FOLDER = "dariushKingking000", "koyeb3", "frames"
          headers = {'Authorization': f'token {GITHUB_TOKEN}', 'Accept': 'application/vnd.github.v3+json'}
          url = f"https://api.github.com/repos/{REPO_OWNER}/{REPO_NAME}/contents/{FRAME_FOLDER}"
          response = requests.get(url, headers=headers)
          if response.status_code == 200:
              files = response.json()
              if files and isinstance(files, list):
                  png_files = [f for f in files if f['name'].endswith('.png')]
                  print(f"🗑️ حذف {len(png_files)} فریم قدیمی...")
                  for old_file in png_files:
                      delete_url = f"https://api.github.com/repos/{REPO_OWNER}/{REPO_NAME}/contents/{FRAME_FOLDER}/{old_file['name']}"
                      delete_data = { "message": f"🗑️ Clear old frame {old_file['name']}", "sha": old_file['sha'], "branch": "main" }
                      requests.delete(delete_url, headers=headers, json=delete_data)
                  print("✅ فریم‌های قدیمی حذف شدند")
          else:
              dummy_content = base64.b64encode(b"frames folder").decode('utf-8')
              dummy_data = { "message": "Create frames folder", "content": dummy_content, "branch": "main" }
              requests.put(url, headers=headers, json=dummy_data)
              print("📁 پوشه frames ایجاد شد")
          EOF

      - name: Run Remote Browser Server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > remote_browser.py << 'EOF'
          import requests, time, datetime, os, base64, sys, uuid
          from playwright.sync_api import sync_playwright

          def debug_print(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
              sys.stdout.flush()

          TARGET_REPO_OWNER, TARGET_REPO_NAME, FILE_PATH, FRAME_FOLDER = "dariushKingking000", "koyeb3", "c.txt", "frames"
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')
          headers = {'Authorization': f'token {GITHUB_TOKEN}', 'Accept': 'application/vnd.github.v3+json'}

          def upload_frame(frame_data):
              """آپلود فریم با نام یکتا (UUID) - مقاوم در برابر خطای 409"""
              unique_id = f"{datetime.datetime.now().strftime('%Y%m%d_%H%M%S')}_{uuid.uuid4().hex[:12]}"
              file_path = f"{FRAME_FOLDER}/frame_{unique_id}.png"
              content = base64.b64encode(frame_data).decode('utf-8')
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{file_path}"
              
              data = {"message": f"📸 Frame {unique_id[:30]}", "content": content, "branch": "main"}
              put_response = requests.put(url, headers=headers, json=data)
              if put_response.status_code in [200, 201]:
                  debug_print(f"✅ فریم آپلود شد: frame_{unique_id}.png")
                  return True
              else:
                  debug_print(f"⚠️ خطا در آپلود فریم معمولی: {put_response.status_code}. تلاش مجدد با نام دیگر...")
                  # تلاش مجدد با نام جدید
                  unique_id_retry = f"{datetime.datetime.now().strftime('%Y%m%d_%H%M%S')}_{uuid.uuid4().hex[:12]}_{int(time.time()*1000)}"
                  file_path_retry = f"{FRAME_FOLDER}/frame_{unique_id_retry}.png"
                  url_retry = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{file_path_retry}"
                  data_retry = {"message": f"📸 Frame {unique_id_retry[:30]}", "content": content, "branch": "main"}
                  put_response_retry = requests.put(url_retry, headers=headers, json=data_retry)
                  
                  if put_response_retry.status_code in [200, 201]:
                      debug_print(f"✅ فریم با موفقیت در تلاش دوم آپلود شد: frame_{unique_id_retry}.png")
                      return True
                  else:
                      debug_print(f"❌ خطا در آپلود فریم حتی در تلاش دوم: {put_response_retry.status_code}")
                      return False

          def get_c_txt_content():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              try:
                  response = requests.get(url, headers=headers)
                  if response.status_code == 200:
                      content = response.json().get('content', '')
                      if content: return base64.b64decode(content).decode('utf-8').strip()
              except Exception as e: debug_print(f"❌ خطا در دریافت c.txt: {e}")
              return None

          def clear_c_txt():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              content_b64 = base64.b64encode(b"# waiting for next command").decode('utf-8')
              response = requests.get(url, headers=headers)
              sha = response.json().get('sha') if response.status_code == 200 else None
              data = {"message": "🧹 Clear commands", "content": content_b64, "branch": "main"}
              if sha: data["sha"] = sha
              requests.put(url, headers=headers, json=data)
              debug_print("🗑️ c.txt پاک شد")

          def execute_command(page, command):
              cmd_lower = command.lower().strip()
              if cmd_lower.startswith('click '):
                  parts = cmd_lower.split()
                  if len(parts) == 3:
                      try:
                          x, y = int(parts[1]), int(parts[2])
                          debug_print(f"🖱️ کلیک در ({x}, {y})")
                          page.mouse.click(x, y)
                          return True
                      except ValueError: debug_print(f"⚠️ مختصات نامعتبر: {command}")
                  else: debug_print(f"⚠️ فرمت click نامعتبر: {command}")
              elif cmd_lower.startswith('type '):
                  parts = command.split(' ', 1)
                  if len(parts) == 2:
                      debug_print(f"⌨️ تایپ: {parts[1]}")
                      page.keyboard.type(parts[1])
                      return True
                  else: debug_print(f"⚠️ دستور type بدون متن: {command}")
              elif cmd_lower.startswith('#'): debug_print(f"ℹ️ نظر: {command}")
              elif cmd_lower == "enter":
                  debug_print(f"⏎ کلید Enter زده شد")
                  page.keyboard.press("Enter")
                  return True
              else: debug_print(f"⚠️ دستور ناشناخته: {command}")
              return False

          def clean_old_frames(max_frames=100):
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FRAME_FOLDER}"
              response = requests.get(url, headers=headers)
              if response.status_code == 200:
                  files = response.json()
                  if files and isinstance(files, list):
                      png_files = sorted([f for f in files if f['name'].endswith('.png')], key=lambda x: x['name'])
                      if len(png_files) > max_frames:
                          for old_file in png_files[:-max_frames]:
                              delete_url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FRAME_FOLDER}/{old_file['name']}"
                              delete_data = {"message": f"🗑️ حذف {old_file['name']}", "sha": old_file['sha'], "branch": "main"}
                              requests.delete(delete_url, headers=headers, json=delete_data)
                              debug_print(f"🗑️ حذف: {old_file['name']}")

          def main():
              debug_print("🚀 Remote Browser Server شروع به کار کرد")
              last_command = None
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()
                  page.goto('https://www.google.com')
                  debug_print("✅ صفحه گوگل باز شد")
                  screenshot = page.screenshot(type='png')
                  upload_frame(screenshot)
                  while True:
                      try:
                          content = get_c_txt_content()
                          if content and content != last_command and not content.startswith('#'):
                              debug_print(f"📖 دستور جدید: {content}")
                              if execute_command(page, content):
                                  last_command = content
                                  time.sleep(1)
                                  screenshot = page.screenshot(type='png')
                                  upload_frame(screenshot)
                                  clear_c_txt()
                              else:
                                  debug_print(f"⚠️ خطا در اجرای دستور: {content}")
                                  clear_c_txt()
                          time.sleep(3)
                          screenshot = page.screenshot(type='png')
                          upload_frame(screenshot)
                          clean_old_frames(100)
                      except Exception as e:
                          debug_print(f"💥 خطا: {e}")
                          time.sleep(5)
          if __name__ == "__main__":
              main()
          EOF
          python3 remote_browser.py
