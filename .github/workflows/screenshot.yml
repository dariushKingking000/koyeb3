name: Remote Browser Controller - Stealth
on: 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          pip install requests

      - name: Run Remote Browser Server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > remote_browser.py << 'EOF'
          import requests
          import time
          import datetime
          import os
          import base64
          import sys
          import uuid
          import random
          from playwright.sync_api import sync_playwright

          if sys.platform == 'win32':
              sys.stdout.reconfigure(encoding='utf-8', errors='replace')

          def debug_print(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
              sys.stdout.flush()

          TARGET_REPO_OWNER = "dariushKingking000"
          TARGET_REPO_NAME = "koyeb3"
          FILE_PATH = "c.txt"
          FRAME_FOLDER = "frames"
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')

          headers = {
              'Authorization': f'token {GITHUB_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }

          def upload_frame(frame_data, description=""):
              unique_id = f"{datetime.datetime.now().strftime('%Y%m%d_%H%M%S')}_{uuid.uuid4().hex[:8]}"
              file_path = f"{FRAME_FOLDER}/frame_{unique_id}.png"
              content = base64.b64encode(frame_data).decode('utf-8')
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{file_path}"
              data = {"message": f"{description}", "content": content, "branch": "main"}
              put_response = requests.put(url, headers=headers, json=data)
              if put_response.status_code in [200, 201]:
                  debug_print(f"Frame uploaded: {description}")
                  return True
              return False

          def get_c_txt_content():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              try:
                  response = requests.get(url, headers=headers)
                  if response.status_code == 200:
                      content = response.json().get('content', '')
                      if content:
                          decoded = base64.b64decode(content).decode('utf-8')
                          return decoded.strip()
                  return None
              except Exception as e:
                  debug_print(f"Error reading c.txt: {e}")
                  return None

          def clear_c_txt():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              response = requests.get(url, headers=headers)
              sha = response.json().get('sha') if response.status_code == 200 else None
              content_b64 = base64.b64encode(b"# waiting").decode('utf-8')
              data = {"message": "Clear", "content": content_b64, "branch": "main"}
              if sha:
                  data["sha"] = sha
              requests.put(url, headers=headers, json=data)
              debug_print("c.txt cleared")

          def execute_command(page, command):
              cmd_lower = command.lower().strip()
              debug_print(f"EXECUTING: {command}")
              
              if cmd_lower.startswith('click '):
                  parts = cmd_lower.split()
                  if len(parts) == 3:
                      try:
                          x, y = int(parts[1]), int(parts[2])
                          debug_print(f"Click at ({x}, {y})")
                          page.mouse.click(x, y)
                          return True
                      except ValueError:
                          debug_print(f"Invalid coordinates")
                          return False
                  else:
                      debug_print(f"Invalid click format")
                      return False

              elif cmd_lower == "enter":
                  debug_print("Enter pressed")
                  page.keyboard.press("Enter")
                  return True

              else:
                  debug_print(f"Typing: [{command}]")
                  for ch in command:
                      page.keyboard.type(ch, delay=random.randint(30, 80))
                      time.sleep(random.uniform(0.02, 0.07))
                  debug_print(f"Typing complete")
                  return True

          def main():
              debug_print("Starting Stealth Browser...")

              last_command = None

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          '--no-sandbox',
                          '--disable-dev-shm-usage',
                          '--disable-blink-features=AutomationControlled',
                          '--disable-features=IsolateOrigins,site-per-process',
                          '--disable-web-security',
                          '--disable-features=OptimizationHints,OptimizationHintsFetching',
                          '--disable-default-apps',
                          '--disable-component-extensions-with-background-pages',
                      ]
                  )
                  
                  context = browser.new_context(
                      viewport={'width': 1920, 'height': 1080},
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                      locale='en-US',
                      timezone_id='America/New_York',
                      extra_http_headers={
                          'Accept-Language': 'en-US,en;q=0.9',
                          'Accept-Encoding': 'gzip, deflate, br',
                          'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                          'Sec-Ch-Ua': '"Not_A Brand";v="8", "Chromium";v="120"',
                          'Sec-Ch-Ua-Mobile': '?0',
                          'Sec-Ch-Ua-Platform': '"Windows"',
                          'Sec-Fetch-Dest': 'document',
                          'Sec-Fetch-Mode': 'navigate',
                          'Sec-Fetch-Site': 'none',
                          'Sec-Fetch-User': '?1',
                          'Upgrade-Insecure-Requests': '1',
                      }
                  )
                  
                  page = context.new_page()
                  
                  # مخفی کردن کامل webdriver
                  page.add_init_script("""
                      Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
                      Object.defineProperty(navigator, 'plugins', {get: () => [1,2,3,4,5]});
                      Object.defineProperty(navigator, 'languages', {get: () => ['en-US', 'en']});
                      window.chrome = {runtime: {}};
                      const originalQuery = window.navigator.permissions.query;
                      window.navigator.permissions.query = (parameters) => (
                          parameters.name === 'notifications' ?
                              Promise.resolve({state: Notification.permission}) :
                              originalQuery(parameters)
                      );
                  """)
                  
                  debug_print("Going to DuckDuckGo (no captcha)...")
                  page.goto('https://duckduckgo.com', wait_until='domcontentloaded', timeout=60000)
                  debug_print(f"Opened: {page.url}")
                  
                  time.sleep(2)

                  screenshot = page.screenshot(type='png')
                  upload_frame(screenshot, "initial")

                  while True:
                      try:
                          content = get_c_txt_content()
                          
                          if content and content != last_command and not content.startswith('#'):
                              debug_print(f"NEW COMMAND: {content}")
                              
                              if execute_command(page, content):
                                  last_command = content
                                  time.sleep(0.8)
                                  screenshot = page.screenshot(type='png')
                                  upload_frame(screenshot, f"after")
                                  clear_c_txt()
                              else:
                                  clear_c_txt()
                          else:
                              time.sleep(5)
                              
                      except Exception as e:
                          debug_print(f"Error: {e}")
                          time.sleep(5)

          if __name__ == "__main__":
              main()
          EOF

          python remote_browser.py
