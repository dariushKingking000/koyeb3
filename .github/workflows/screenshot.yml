name: Google Screenshot to Repo
on: [push]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Playwright
      run: |
        pip install playwright pillow requests
        playwright install chromium
    
    - name: Test Python
      run: python -c "print('✅ Python کار میکنه!')"
    
    - name: Check c.txt & Google screenshot
      run: |
        echo "🚀 شروع فرآیند..."
        echo "🔍 چک کردن c.txt..."
        python -c "
        import requests
        import time
        from playwright.sync_api import sync_playwright
        import datetime
        import sys
        
        url = 'https://github.com/dariushKingking000/koyeb3/raw/main/c.txt'
        checks = 0
        max_checks = 3
        print('شروع - حداکثر ' + str(max_checks) + ' بار')
        
        while checks < max_checks:
            checks = checks + 1
            print('چک #' + str(checks))
            try:
                r = requests.get(url, timeout=10)
                if r.status_code == 200:
                    print('PIK! محتوا: ' + r.text.strip())
                    break
                else:
                    print('ندید')
            except:
                print('خطا')
            if checks < max_checks:
                print('60s صبر')
                time.sleep(60)
        print('پایان')
        "
        echo "🏁 تموم!"
    
    - name: Commit & Push
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add google_*.png
        git commit -m "🌐 Screenshot $(date +%Y-%m-%d_%H-%M)" || exit 0
        git push
