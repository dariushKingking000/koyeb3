name: Remote Browser Controller - Bing
on: 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          pip install requests

      - name: Run Remote Browser Server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > remote_browser.py << 'EOF'
          import requests
          import time
          import datetime
          import os
          import base64
          import sys
          import uuid
          import random
          from playwright.sync_api import sync_playwright

          if sys.platform == 'win32':
              sys.stdout.reconfigure(encoding='utf-8', errors='replace')

          def debug_print(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
              sys.stdout.flush()

          TARGET_REPO_OWNER = "dariushKingking000"
          TARGET_REPO_NAME = "koyeb3"
          FILE_PATH = "c.txt"
          FRAME_FOLDER = "frames"
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')

          headers = {
              'Authorization': f'token {GITHUB_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }

          def upload_frame(frame_data, description=""):
              unique_id = f"{datetime.datetime.now().strftime('%Y%m%d_%H%M%S')}_{uuid.uuid4().hex[:8]}"
              file_path = f"{FRAME_FOLDER}/frame_{unique_id}.png"
              content = base64.b64encode(frame_data).decode('utf-8')
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{file_path}"
              data = {"message": f"{description}", "content": content, "branch": "main"}
              put_response = requests.put(url, headers=headers, json=data)
              if put_response.status_code in [200, 201]:
                  debug_print(f"Frame uploaded: {description}")
                  return True
              return False

          def get_c_txt_content():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              try:
                  response = requests.get(url, headers=headers)
                  if response.status_code == 200:
                      content = response.json().get('content', '')
                      if content:
                          decoded = base64.b64decode(content).decode('utf-8')
                          return decoded.strip()
                  return None
              except Exception as e:
                  debug_print(f"Error reading c.txt: {e}")
                  return None

          def clear_c_txt():
              url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
              response = requests.get(url, headers=headers)
              sha = response.json().get('sha') if response.status_code == 200 else None
              content_b64 = base64.b64encode(b"# waiting").decode('utf-8')
              data = {"message": "Clear", "content": content_b64, "branch": "main"}
              if sha:
                  data["sha"] = sha
              requests.put(url, headers=headers, json=data)
              debug_print("c.txt cleared")

          def execute_command(page, command):
              cmd_lower = command.lower().strip()
              debug_print(f"EXECUTING: {command}")
              
              if cmd_lower.startswith('click '):
                  parts = cmd_lower.split()
                  if len(parts) == 3:
                      try:
                          x, y = int(parts[1]), int(parts[2])
                          debug_print(f"Click at ({x}, {y})")
                          page.mouse.click(x, y)
                          time.sleep(0.3)
                          return True
                      except ValueError:
                          debug_print(f"Invalid coordinates")
                          return False
                  else:
                      debug_print(f"Invalid click format")
                      return False

              elif cmd_lower == "enter":
                  debug_print("Enter pressed")
                  page.keyboard.press("Enter")
                  time.sleep(0.3)
                  return True

              elif cmd_lower.startswith('#') or cmd_lower.startswith('//'):
                  debug_print(f"Comment/Skip: {command}")
                  return True

              else:
                  debug_print(f"Typing: [{command}]")
                  page.keyboard.type(command, delay=random.randint(30, 80))
                  time.sleep(0.3)
                  return True

          def main():
              debug_print("Starting Bing Browser...")

              last_command = None

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          '--no-sandbox',
                          '--disable-dev-shm-usage',
                          '--disable-blink-features=AutomationControlled',
                      ]
                  )
                  
                  context = browser.new_context(
                      viewport={'width': 1280, 'height': 720},
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
                  )
                  
                  page = context.new_page()
                  
                  page.add_init_script("""
                      Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
                  """)
                  
                  debug_print("Going to Bing...")
                  page.goto('https://www.bing.com', wait_until='domcontentloaded', timeout=60000)
                  debug_print(f"Opened: {page.url}")
                  
                  time.sleep(2)
                  
                  # کلیک روی باکس جستجو
                  try:
                      search_box = page.locator('#sb_form_q')
                      if search_box.count() > 0:
                          search_box.click()
                          debug_print("Clicked on Bing search box")
                      else:
                          page.keyboard.press('Tab')
                          debug_print("Used Tab to focus")
                  except Exception as e:
                      debug_print(f"Could not focus: {e}")
                  
                  screenshot = page.screenshot(type='png')
                  upload_frame(screenshot, "initial")

                  while True:
                      try:
                          content = get_c_txt_content()
                          
                          if content and content != last_command:
                              lines = content.strip().split('\n')
                              
                              # فیلتر کردن خطوط خالی و کامنت
                              commands_list = [line.strip() for line in lines if line.strip() and not line.strip().startswith('#') and not line.strip().startswith('//')]
                              
                              if commands_list:
                                  debug_print(f"FOUND {len(commands_list)} COMMANDS")
                                  
                                  # اجرای همه دستورات
                                  for cmd in commands_list:
                                      debug_print(f"Running: {cmd}")
                                      execute_command(page, cmd)
                                      time.sleep(0.2)
                                  
                                  # بعد از اجرای همه دستورات، یک فریم بگیر
                                  time.sleep(0.5)
                                  screenshot = page.screenshot(type='png')
                                  upload_frame(screenshot, f"result_{len(commands_list)}cmds")
                                  debug_print(f"Frame taken after {len(commands_list)} commands")
                                  
                                  clear_c_txt()
                                  last_command = content
                              else:
                                  time.sleep(5)
                          else:
                              time.sleep(5)
                              
                      except Exception as e:
                          debug_print(f"Error in main loop: {e}")
                          time.sleep(5)

          if __name__ == "__main__":
              main()
          EOF

          python remote_browser.py
