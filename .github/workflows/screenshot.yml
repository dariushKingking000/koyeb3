name: Google Screenshot to Repo with Commands
on: [push]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Playwright & Requests
      run: |
        pip install playwright pillow requests
        playwright install chromium
    
    - name: Run Command Watcher
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        cat > watcher.py << 'EOF'
        import requests
        import time
        import datetime
        import os
        import base64
        import sys
        from playwright.sync_api import sync_playwright
        
        def debug_print(msg):
            print(msg)
            sys.stdout.flush()
        
        # ریپوی مقصد برای ذخیره عکس‌ها
        TARGET_REPO_OWNER = "dariushKingking000"
        TARGET_REPO_NAME = "koyeb3"
        FILE_PATH = "c.txt"
        HISTORY_FILE = "executed_commands.txt"
        GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')
        
        headers = {
            'Authorization': f'token {GITHUB_TOKEN}',
            'Accept': 'application/vnd.github.v3+json'
        }
        
        def upload_file_to_repo(file_path, commit_message):
            """آپلود فایل به ریپوی koyeb3"""
            with open(file_path, 'rb') as f:
                content = base64.b64encode(f.read()).decode('utf-8')
            
            # بررسی وجود فایل
            url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{file_path}"
            response = requests.get(url, headers=headers)
            sha = None
            if response.status_code == 200:
                sha = response.json().get('sha')
            
            # ایجاد یا آپدیت فایل
            data = {
                "message": commit_message,
                "content": content,
                "branch": "main"
            }
            if sha:
                data["sha"] = sha
            
            put_response = requests.put(url, headers=headers, json=data)
            if put_response.status_code in [200, 201]:
                debug_print(f"✅ فایل {file_path} با موفقیت آپلود شد")
                return True
            else:
                debug_print(f"❌ خطا در آپلود {file_path}: {put_response.status_code}")
                return False
        
        def load_executed_commands():
            try:
                with open(HISTORY_FILE, 'r') as f:
                    return set(line.strip() for line in f if line.strip())
            except FileNotFoundError:
                return set()
        
        def save_executed_command(command):
            with open(HISTORY_FILE, 'a') as f:
                f.write(command + '\n')
            debug_print(f"💾 ذخیره شد در تاریخچه: {command}")
        
        def get_c_txt_content():
            url = f"https://api.github.com/repos/{TARGET_REPO_OWNER}/{TARGET_REPO_NAME}/contents/{FILE_PATH}"
            try:
                response = requests.get(url, headers=headers)
                if response.status_code == 200:
                    content = response.json().get('content', '')
                    if content:
                        decoded = base64.b64decode(content).decode('utf-8')
                        return decoded.strip()
                return None
            except Exception as e:
                debug_print(f"❌ خطا در دریافت فایل: {e}")
                return None
        
        def execute_command(page, command, executed_set):
            cmd_lower = command.lower().strip()
            
            if command in executed_set:
                debug_print(f"⏭️ دستور تکراری: {command}")
                return False
            
            if cmd_lower.startswith('click '):
                parts = cmd_lower.split()
                if len(parts) == 3:
                    try:
                        x = int(parts[1])
                        y = int(parts[2])
                        debug_print(f"🖱️ کلیک در مختصات ({x}, {y})")
                        page.mouse.click(x, y)
                        time.sleep(0.5)
                        return True
                    except ValueError:
                        debug_print(f"⚠️ مختصات نامعتبر: {command}")
                        return False
            
            elif cmd_lower.startswith('type '):
                parts = command.split(' ', 1)
                if len(parts) == 2:
                    text_to_type = parts[1]
                    debug_print(f"⌨️ تایپ کردن: {text_to_type}")
                    page.keyboard.type(text_to_type)
                    time.sleep(0.5)
                    return True
                else:
                    debug_print(f"⚠️ دستور type بدون متن: {command}")
                    return False
            
            else:
                debug_print(f"⚠️ دستور ناشناخته: {command}")
                return False
        
        def main_loop():
            debug_print("🚀 واتچر دستورات شروع به کار کرد")
            debug_print(f"🎯 ریپوی مقصد: {TARGET_REPO_OWNER}/{TARGET_REPO_NAME}")
            
            loop_count = 0
            while True:
                loop_count += 1
                debug_print(f"\n{'='*50}")
                debug_print(f"🔄 چک شماره {loop_count} - زمان: {datetime.datetime.now().strftime('%H:%M:%S')}")
                
                try:
                    executed = load_executed_commands()
                    
                    content = get_c_txt_content()
                    
                    if content:
                        commands = [line.strip() for line in content.split('\n') if line.strip()]
                        new_commands = [cmd for cmd in commands if cmd not in executed]
                        
                        if new_commands:
                            with sync_playwright() as p:
                                browser = p.chromium.launch(headless=True)
                                page = browser.new_page()
                                page.goto('https://www.google.com')
                                time.sleep(3)
                                
                                for command in new_commands:
                                    if execute_command(page, command, executed):
                                        save_executed_command(command)
                                        executed.add(command)
                                    time.sleep(0.5)
                                
                                now = datetime.datetime.now().strftime('%Y%m%d_%H%M%S')
                                screenshot_name = f"google_{now}.png"
                                page.screenshot(path=screenshot_name, full_page=True)
                                debug_print(f"📸 اسکرین‌شات ذخیره شد: {screenshot_name}")
                                browser.close()
                            
                            # آپلود عکس و تاریخچه به ریپوی koyeb3
                            upload_file_to_repo(screenshot_name, f"📸 Google screenshot {now}")
                            upload_file_to_repo(HISTORY_FILE, "📝 Update command history")
                            
                            # پاک کردن فایل محلی بعد از آپلود
                            os.remove(screenshot_name)
                        else:
                            debug_print("ℹ️ هیچ دستور جدیدی پیدا نشد")
                    else:
                        debug_print("⚠️ فایل c.txt پیدا نشد یا خالی است")
                    
                    time.sleep(60)
                    
                except Exception as e:
                    debug_print(f"💥 خطا: {e}")
                    time.sleep(60)
        
        if __name__ == "__main__":
            main_loop()
        EOF
        
        python3 watcher.py
