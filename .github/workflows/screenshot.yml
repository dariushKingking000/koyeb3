name: Google Screenshot to Repo
on: [push]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Playwright
      run: |
        pip install playwright pillow requests
        playwright install chromium
    
    - name: Screenshot & Check c.txt (30min)
      run: |
        python -c "
import requests
import time
from playwright.sync_api import sync_playwright
import datetime

url = 'https://github.com/dariushKingking000/koyeb3/raw/main/c.txt'
max_checks = 30
found_content = None
timestamp = datetime.datetime.now().strftime('%Y-%m-%d_%H-%M-%S')

print('🚀 شروع - ' + str(max_checks) + ' بار چک (30 دقیقه)')

with sync_playwright() as p:
    browser = p.chromium.launch(headless=False)
    page = browser.new_page()
    
    page.goto('https://www.google.com')
    before_file = 'google_before_' + timestamp + '.png'
    page.screenshot(path=before_file, full_page=True)
    print('📸 Screenshot قبل: ' + before_file)
    
    for check in range(1, max_checks + 1):
        print('\n🔍 چک #' + str(check) + '/' + str(max_checks))
        print('⏰ زمان: ' + datetime.datetime.now().strftime('%H:%M:%S'))
        
        try:
            print('🌐 درخواست: ' + url)
            r = requests.get(url, timeout=15)
            print('📊 Status: ' + str(r.status_code))
            
            if r.status_code == 200:
                content = r.text.strip()
                print('✅ PIK! محتوا: \"' + content + '\"')
                found_content = content
                break
            else:
                print('❌ Status ' + str(r.status_code) + ' - محتوا نیست')
        except Exception as e:
            print('💥 خطا: ' + str(e))
        
        if check < max_checks:
            print('⏳ 60 ثانیه صبر...')
            time.sleep(60)
    
    after_file = 'google_after_' + timestamp + '.png'
    page.goto('https://www.google.com')
    page.screenshot(path=after_file, full_page=True)
    print('📸 Screenshot بعد: ' + after_file)
    browser.close()

print('\n🏁 پایان! پیدا شد: ' + (found_content or 'خیر'))
        "
    
    - name: Commit & Push
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add google_*.png
        if [ -n "$(git diff --staged)" ]; then
          git commit -m "🌐 Screenshots $(date +%Y-%m-%d_%H-%M-%S)"
          git push
        else
          echo "هیچ فایل جدیدی نیست"
        fi
