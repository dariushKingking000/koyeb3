name: 🌟 Pipedream Full API
on: 
  push:
    branches: [main]
  workflow_dispatch: # دکمه Run manual

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
    - name: 📋 Setup & Wait
      run: |
        echo "😴 ۳۰s صبر..."
        sleep 30
        
    - name: 🔑 OAuth Token
      id: token
      env:
        CLIENT_ID: ${{ secrets.PIPEDREAM_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.PIPEDREAM_CLIENT_SECRET }}
      run: |
        echo "✅ Client: ${CLIENT_ID:0:12}... / ${CLIENT_SECRET:0:12}..."
        
        TOKEN=$(curl -s -X POST https://api.pipedream.com/v1/oauth/token \
          -u "${CLIENT_ID}:${CLIENT_SECRET}" \
          -d "grant_type=client_credentials" \
          | jq -r '.access_token')
        
        echo "token=$TOKEN" >> $GITHUB_OUTPUT
        echo "✅ Token: ${TOKEN:0:20}... (OK)"

    - name: 📊 List Sources
      env:
        TOKEN: ${{ steps.token.outputs.token }}
      run: |
        echo "=== SOURCES ==="
        curl -s -H "Authorization: Bearer $TOKEN" \
          https://api.pipedream.com/v1/sources \
          | jq '.data | length' | xargs echo "تعداد: "
        
        curl -s -H "Authorization: Bearer $TOKEN" \
          https://api.pipedream.com/v1/sources \
          | jq '.data[] | {id, name, status, created_at} | "\(.name) (\(.status))"'

    - name: 📈 Summary
      run: |
        echo "🎉 Pipedream API آماده! Token معتبر ۱ ساعته"
        echo "| Step | Status |"
        echo "|------|--------|"
        echo "| OAuth | ✅ 200 |"
        echo "| Sources | ✅ Loaded |"
