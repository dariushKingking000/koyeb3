name: Pipedream OAuth & API Test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: 🔗 OAuth + API Call
      env:
        CLIENT_ID: ${{ secrets.PIPEDREAM_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.PIPEDREAM_CLIENT_SECRET }}
      run: |
        # OAuth Token
        TOKEN=$(curl -s \
          -X POST https://api.pipedream.com/v1/oauth/token \
          -u "${CLIENT_ID}:${CLIENT_SECRET}" \
          -d "grant_type=client_credentials" \
          | jq -r '.access_token')
        
        echo "✅ Token دریافت شد: ${TOKEN:0:20}..."
        
        # تست API با توکن
        curl -s -H "Authorization: Bearer $TOKEN" \
          https://api.pipedream.com/v1/sources \
          | jq '.data | length' \
          | xargs echo "📊 تعداد Sources: "
