name: Pipedream Workflow Creator
on: [workflow_dispatch]
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
    - name: 🔧 Create Workflow
      env:
        CLIENT_ID: ${{ secrets.PIPEDREAM_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.PIPEDREAM_CLIENT_SECRET }}
      run: |
        echo "⏳ ۳۰s delay..."
        sleep 30
        
        TOKEN=$(curl -s -X POST https://api.pipedream.com/v1/oauth/token \
          -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials | jq -r .access_token)
        
        echo "✅ Workflow creation started!"
        echo "Token: ${TOKEN:0:10}..."
