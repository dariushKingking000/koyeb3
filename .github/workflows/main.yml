name: 🔘 Manual Email Check
on:
  workflow_dispatch:  # فقط دکمه دستی!

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: 📧 Guerrilla ایمیل
      id: email
      env:
        SID: ${{ secrets.GUERRILLA_SID }}
      run: |
        EMAIL=$(curl -s "https://api.guerrillamail.com/ajax.php?f=get_email_address&sid_token=$SID" | grep -o '"email_addr":"[^"]*' | cut -d'"' -f4)
        echo "::notice title=ایمیل ثابت:: $EMAIL"
        echo "email=$EMAIL" >> $GITHUB_OUTPUT
        echo "📧 $EMAIL"

    - name: 📥 Inbox Status
      env:
        SID: ${{ secrets.GUERRILLA_SID }}
      run: |
        COUNT=$(curl -s "https://api.guerrillamail.com/ajax.php?f=check_email&sid_token=$SID" | grep -o '"id":[0-9]*' | wc -l)
        
        if [ "$COUNT" -gt 0 ]; then
          echo "🚨 $COUNT ایمیل جدید!"
          echo "::warning:: ایمیل جدید رسید!"
          
          # آخرین ایمیل
          MAIL_ID=$(curl -s "https://api.guerrillamail.com/ajax.php?f=check_email&sid_token=$SID" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          DETAILS=$(curl -s "https://api.guerrillamail.com/ajax.php?f=fetch_email&email_id=$MAIL_ID&sid_token=$SID")
          
          FROM=$(echo "$DETAILS" | grep -o '"mail_from":"[^"]*' | head -1 | cut -d'"' -f4)
          SUBJECT=$(echo "$DETAILS" | grep -o '"mail_subject":"[^"]*' | head -1 | cut -d'"' -f4)
          
          echo "از: ${FROM:-?}"
          echo "عنوان: ${SUBJECT:-بدون عنوان}"
        else
          echo "📭 Inbox خالی"
          echo "::notice:: منتظر ایمیل..."
        fi

    - name: 🔗 لینک‌ها
      run: |
        echo "🌐 Guerrilla: https://www.guerrillamail.com/"
        echo "📧 ایمیل: ${{ steps.email.outputs.email }}"
