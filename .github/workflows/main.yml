name: 🆓 Persistent Temp Email
on:
  push:
  workflow_dispatch:

jobs:
  email-checker:
    runs-on: ubuntu-latest
    steps:
    - name: 📧 دریافت ایمیل موقت (هر بار ثابت)
      id: email
      run: |
        # Guerrilla Mail - بدون block!
        RESPONSE=$(curl -s -H "User-Agent: Mozilla/5.0" \
          'https://api.guerrillamail.com/ajax.php?f=get_email_address')
        
        EMAIL=$(echo "$RESPONSE" | grep -o '"email_addr":"[^"]*' | cut -d'"' -f4)
        SID=$(echo "$RESPONSE" | grep -o '"sid_token":"[^"]*' | cut -d'"' -f4)
        
        echo "email=$EMAIL" >> $GITHUB_OUTPUT
        echo "sid=$SID" >> $GITHUB_OUTPUT
        
        echo "::notice title=E-mail:: $EMAIL"
        echo "::notice title=SID:: $SID (کپی کن برای secret)"

    - name: 📥 چک کردن inbox
      run: |
        SID="${{ steps.email.outputs.sid }}"
        echo "🔍 چک با SID: $SID"
        
        # لیست ایمیل‌ها
        curl -s "https://api.guerrillamail.com/ajax.php?f=check_email&offset=0&sid_token=$SID"
        
        # تمام ایمیل‌ها
        curl -s "https://api.guerrillamail.com/ajax.php?f=fetch_email&offset=0&sid_token=$SID"

    - name: 📤 نمایش نهایی
      run: |
        echo "✅ ایمیل: ${{ steps.email.outputs.email }}"
        echo "🔗 تست: https://www.guerrillamail.com/"
