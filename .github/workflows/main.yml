name: 📧 Temp-Mail.org API
on:
  workflow_dispatch:
  schedule:
    - cron: '*/2 * * * *'

jobs:
  temp-mail:
    runs-on: ubuntu-latest
    steps:
    - name: 📧 ایمیل تصادفی
      id: email
      run: |
        # username تصادفی + domain
        USERNAME=$(openssl rand -hex 8)
        DOMAIN="tempmail.lol"
        EMAIL="$USERNAME@$DOMAIN"
        echo "email=$EMAIL" >> $GITHUB_OUTPUT
        echo "✅ $EMAIL"

    - name: 📥 چک inbox
      id: inbox
      env:
        EMAIL: ${{ steps.email.outputs.email }}
      run: |
        USERNAME=${EMAIL%@*}
        DOMAIN=${EMAIL#*@}
        
        echo "چک $EMAIL..."
        
        # لیست ایمیل‌ها
        MESSAGES=$(curl -s "https://api.temp-mail.org/request/domains/format/json")
        DOMAIN_LIST=$(curl -s "https://api.temp-mail.org/request/domains/format/json" | jq -r '.[].domain')
        echo "دامنه‌ها: $DOMAIN_LIST"
        
        # ایمیل‌های من
        RESPONSE=$(curl -s "https://api.temp-mail.org/request/mail/id/$USERNAME/format/json")
        
        if [ "$RESPONSE" != "[]" ] && [ -n "$RESPONSE" ]; then
          COUNT=$(echo "$RESPONSE" | jq length)
          echo "🚨 $COUNT ایمیل جدید!"
          
          # آخرین ایمیل
          LAST=$(echo "$RESPONSE" | jq '.[0]')
          FROM=$(echo "$LAST" | jq -r '.mail_from')
          SUBJECT=$(echo "$LAST" | jq -r '.mail_subject')
          
          echo "از: $FROM"
          echo "موضوع: $SUBJECT"
          echo "status=new" >> $GITHUB_OUTPUT
        else
          echo "📭 خالی"
          echo "status=empty" >> $GITHUB_OUTPUT
        fi

    - name: 🎯 Alert
      if: steps.inbox.outputs.status == 'new'
      run: |
        echo "::warning:: ایمیل جدید به ${{ steps.email.outputs.email }}!"
        echo "چک: https://temp-mail.org/en/"
