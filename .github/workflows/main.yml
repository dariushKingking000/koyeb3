name: Create Workflow
on: [workflow_dispatch]
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
    - name: Create
      env:
        CLIENT_ID: ${{ secrets.PIPEDREAM_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.PIPEDREAM_CLIENT_SECRET }}
      run: |
        sleep 30
        TOKEN=$(curl -s -X POST https://api.pipedream.com/v1/oauth/token -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials | jq -r .access_token)
        
        curl -X POST "https://api.pipedream.com/v1/workflows" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"name": "Test-'"$(date +%s)"'"}' | jq .
